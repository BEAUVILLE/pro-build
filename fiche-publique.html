<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Fiche artisan — DIGIY BUILD</title>
  <meta name="description" content="Fiche publique d’un artisan DIGIY BUILD : métier, zone et contact direct."/>
  <meta name="robots" content="index,follow,max-image-preview:large"/>
  <meta name="theme-color" content="#0e4226"/>
  <meta name="digiy-build" content="build-public-profile-v1-20260721"/>

  <script>
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      color-scheme:light;
      --bg:#f5ead5;
      --card:#fffaf0;
      --ink:#10251c;
      --muted:#5f6f67;
      --green:#0e4226;
      --green2:#22c55e;
      --gold:#c4973f;
      --line:rgba(16,37,28,.14);
      --shadow:0 24px 70px rgba(6,59,43,.18);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100dvh;
      padding:18px;
      color:var(--ink);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(720px 420px at 0% 0%,rgba(34,197,94,.19),transparent 60%),
        radial-gradient(680px 420px at 100% 0%,rgba(196,151,63,.24),transparent 58%),
        linear-gradient(180deg,#fff8e9,var(--bg));
    }
    .shell{width:min(760px,100%);margin:0 auto;display:grid;gap:14px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:.78rem;font-weight:1000;letter-spacing:.12em;color:var(--green);text-transform:uppercase}
    .badge{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border-radius:999px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.24);color:var(--green);font-size:.76rem;font-weight:950}
    .card{overflow:hidden;border:1px solid var(--line);border-radius:30px;background:rgba(255,250,240,.96);box-shadow:var(--shadow)}
    .cover{position:relative;min-height:220px;background:linear-gradient(135deg,var(--green),#1e7a46 60%,var(--gold));display:grid;place-items:center;overflow:hidden}
    .cover img{width:100%;height:100%;min-height:220px;max-height:420px;object-fit:cover;display:none}
    .mark{width:112px;height:112px;display:grid;place-items:center;border-radius:34px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff0a8;font-size:3rem;font-weight:1000;box-shadow:0 18px 46px rgba(0,0,0,.20)}
    .content{padding:22px}
    h1{margin:0;color:var(--green);font-size:clamp(2.25rem,9vw,4.5rem);line-height:.95;letter-spacing:-.055em}
    .meta{margin-top:9px;color:var(--gold);font-size:1.03rem;font-weight:1000}
    .description{margin:18px 0 0;color:var(--ink);font-size:1rem;line-height:1.62;white-space:pre-line}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
    .chip{display:inline-flex;align-items:center;min-height:34px;padding:0 11px;border-radius:999px;background:rgba(14,66,38,.07);border:1px solid rgba(14,66,38,.12);font-size:.82rem;font-weight:900}
    .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
    .btn{min-height:58px;display:flex;align-items:center;justify-content:center;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);text-decoration:none;text-align:center;font:inherit;font-weight:1000;cursor:pointer}
    .btn.main{color:#062013;border-color:transparent;background:linear-gradient(135deg,var(--green2),#bbf7d0)}
    .btn.gold{color:#2d2308;border-color:transparent;background:linear-gradient(135deg,#fff0a8,var(--gold))}
    .btn[hidden]{display:none}
    .empty{padding:30px 22px;text-align:center}
    .empty h1{font-size:2.2rem}
    .empty p{color:var(--muted);line-height:1.55}
    .foot{text-align:center;color:var(--muted);font-size:.8rem;font-weight:800}
    [hidden]{display:none!important}
    @media(max-width:560px){
      body{padding:12px}
      .content{padding:18px}
      .card{border-radius:24px}
      .cover,.cover img{min-height:190px}
      .actions{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div class="brand">DIGIY BUILD</div>
      <div class="badge">Contact direct · 0% commission</div>
    </div>

    <article class="card" id="profile" hidden>
      <div class="cover">
        <img id="cover" alt="Photo professionnelle"/>
        <div class="mark" id="mark">🧰</div>
      </div>
      <div class="content">
        <h1 id="name">Artisan DIGIY</h1>
        <div class="meta" id="meta">Métier · Zone</div>
        <div class="description" id="description"></div>
        <div class="chips" id="chips"></div>
        <div class="actions">
          <a class="btn main" id="whatsapp" href="#" rel="noopener">💬 WhatsApp direct</a>
          <a class="btn" id="call" href="#">📞 Appeler</a>
          <a class="btn gold" id="external" href="#" target="_blank" rel="noopener" hidden>↗ Voir le site</a>
          <button class="btn" id="share" type="button">↗ Partager la fiche</button>
        </div>
      </div>
    </article>

    <section class="card empty" id="empty">
      <h1 id="emptyTitle">Chargement…</h1>
      <p id="emptyText">Recherche de la fiche artisan.</p>
    </section>

    <div class="foot">Le professionnel garde son client, son prix et sa décision.</div>
  </main>

  <script>
    (()=>{
      "use strict";
      const TABLES=["digiy_build_public_profiles","digiy_build_pros"];
      const qs=new URLSearchParams(location.search);
      const slug=String(qs.get("slug")||qs.get("id")||"")
        .trim().toLowerCase().replace(/[^a-z0-9._-]/g,"");
      const $=id=>document.getElementById(id);

      function phone(value){
        const digits=String(value||"").replace(/\D/g,"");
        if(digits.length===9)return "221"+digits;
        if(digits.length===10&&digits.startsWith("0"))return "221"+digits.slice(1);
        return digits;
      }
      function safeUrl(value){
        const raw=String(value||"").trim();
        if(!raw)return "";
        try{
          const u=new URL(raw,location.href);
          return /^https?:$/i.test(u.protocol)?u.toString():"";
        }catch(_){return ""}
      }
      function safePublicUrl(value){
        const url=safeUrl(value);
        if(!url)return "";
        try{
          const u=new URL(url);
          const low=(u.pathname+" "+u.search+" "+u.hash).toLowerCase();
          return ["pin.html","fiche.html","atelier.html","cockpit.html","hub.html","session.html","admin"].some(part=>low.includes(part))?"":url;
        }catch(_){return ""}
      }
      function list(value){
        if(Array.isArray(value))return value.map(String).map(v=>v.trim()).filter(Boolean);
        return String(value||"").split(/\n|,|·|•|;|\|/g).map(v=>v.trim()).filter(Boolean);
      }
      function unavailable(title,text){
        $("profile").hidden=true;
        $("empty").hidden=false;
        $("emptyTitle").textContent=title;
        $("emptyText").textContent=text;
      }
      function client(){
        if(!window.supabase?.createClient)return null;
        return window.supabase.createClient(
          window.DIGIY_SUPABASE_URL,
          window.DIGIY_SUPABASE_ANON_KEY,
          {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}
        );
      }
      async function byColumn(sb,table,column){
        try{
          const {data,error}=await sb.from(table).select("*").eq(column,slug).limit(1).maybeSingle();
          if(error)return null;
          return data||null;
        }catch(_){return null}
      }
      async function loadRow(sb){
        for(const table of TABLES){
          const direct=await byColumn(sb,table,"slug");
          if(direct)return direct;
          const legacy=await byColumn(sb,table,"slug_key");
          if(legacy)return legacy;
        }
        return null;
      }
      function render(row){
        if(!row||row.is_published===false||row.is_active===false){
          unavailable("Fiche non publiée","Cette fiche artisan n’est pas disponible pour le moment.");
          return;
        }

        const name=String(row.display_name||row.name||row.title||"Artisan DIGIY").trim();
        const trade=String(row.metier||row.profession||row.trade||"Entrepreneur multi services").trim();
        const zone=String(row.zone||row.city||row.region||"Zone à préciser").trim();
        const description=String(row.description||row.bio||"Contactez directement ce professionnel pour présenter votre besoin.").trim();
        const digits=phone(row.whatsapp||row.whatsapp_phone||row.phone||row.contact_phone);
        const services=list(row.specialties||row.services||row.services_text).slice(0,12);
        const image=safeUrl(row.cover_url||row.photo_url||row.logo_url);
        const external=safePublicUrl(row.public_url||row.profile_url||row.fiche_url);

        document.title=`${name} — DIGIY BUILD`;
        $("name").textContent=name;
        $("meta").textContent=[trade,zone].filter(Boolean).join(" · ");
        $("description").textContent=description;
        $("mark").textContent=(name[0]||"🧰").toUpperCase();
        $("chips").innerHTML="";
        services.forEach(service=>{
          const chip=document.createElement("span");
          chip.className="chip";
          chip.textContent=service;
          $("chips").appendChild(chip);
        });

        if(image){
          $("cover").src=image;
          $("cover").style.display="block";
          $("cover").onerror=()=>{$("cover").style.display="none"};
          $("mark").style.display="none";
        }

        if(digits){
          $("whatsapp").href=`https://wa.me/${digits}?text=${encodeURIComponent("Bonjour, je viens de votre fiche DIGIY BUILD.")}`;
          $("call").href=`tel:+${digits}`;
        }else{
          $("whatsapp").hidden=true;
          $("call").hidden=true;
        }

        if(external&&!/fiche-publique\.html/i.test(external)){
          $("external").href=external;
          $("external").hidden=false;
        }

        $("share").onclick=async()=>{
          const shareData={title:`${name} — DIGIY BUILD`,text:`${trade} · ${zone}`,url:location.href};
          try{
            if(navigator.share){await navigator.share(shareData);return}
          }catch(error){if(error?.name==="AbortError")return}
          location.href="https://wa.me/?text="+encodeURIComponent(`${shareData.text}\n${shareData.url}`);
        };

        $("empty").hidden=true;
        $("profile").hidden=false;
      }

      async function boot(){
        if(!slug){
          unavailable("Fiche introuvable","Le lien public ne contient pas l’identifiant de la fiche.");
          return;
        }
        const sb=client();
        if(!sb){
          unavailable("Service indisponible","La fiche ne peut pas être chargée pour le moment.");
          return;
        }
        const row=await loadRow(sb);
        if(!row){
          unavailable("Fiche introuvable","Cette fiche n’est pas publiée ou son lien doit être actualisé.");
          return;
        }
        render(row);
      }

      boot();
    })();
  </script>
</body>
</html>
