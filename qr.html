<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#061b14"/>
  <title>DIGIY BUILD — QR fiche artisan</title>

  <script>
    window.DIGIY_MODULE = "BUILD";
    window.DIGIY_LOGIN_URL = "./pin.html";
    window.DIGIY_SUPABASE_URL = window.DIGIY_SUPABASE_URL || "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = window.DIGIY_SUPABASE_ANON_KEY || "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON || window.DIGIY_SUPABASE_ANON_KEY;
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#061b14;
      --accent:#facc15;
      --green:#22c55e;
      --muted:rgba(234,255,241,.72);
      --text:#eafff1;
      --line:rgba(255,255,255,.14);
      --shadow:0 18px 60px rgba(0,0,0,.45);
      --r:20px;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(900px 520px at 10% -10%, rgba(34,197,94,.18), transparent 60%),
        radial-gradient(900px 520px at 110% 0%, rgba(250,204,21,.12), transparent 55%),
        linear-gradient(135deg,#04110d,#061b14);
    }

    a{color:inherit;text-decoration:none}

    .back{
      position:fixed;
      left:14px;
      top:14px;
      z-index:999;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:12px 14px;
      border-radius:14px;
      text-decoration:none;
      font-weight:950;
      font-size:14px;
      color:#eafff1;
      background:rgba(7,24,16,.88);
      border:1px solid rgba(250,204,21,.22);
      box-shadow:0 14px 40px rgba(0,0,0,.32);
      backdrop-filter:blur(8px);
    }

    .wrap{
      max-width:900px;
      margin:auto;
      padding:18px;
      padding-top:76px;
    }

    .hero{margin-bottom:14px}

    .kicker{
      color:var(--accent);
      font-weight:1000;
      letter-spacing:.16em;
      text-transform:uppercase;
      font-size:12px;
      margin-bottom:8px;
    }

    h1{
      font-size:clamp(1.8rem,5vw,3.1rem);
      line-height:1.05;
      margin-bottom:8px;
      font-weight:1000;
      letter-spacing:-.04em;
      background:linear-gradient(135deg, var(--green), var(--accent));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    p{
      color:var(--muted);
      line-height:1.5;
      margin-bottom:10px;
      font-weight:750;
      font-size:1.02rem;
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius:var(--r);
      padding:16px;
      margin-top:14px;
      box-shadow:var(--shadow);
    }

    .pillRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.18);
      color:#d1fae5;
      font-weight:900;
      font-size:.92rem;
    }

    .pill.ok{
      color:#bbf7d0;
      border-color:rgba(34,197,94,.36);
      background:rgba(34,197,94,.10);
    }

    .pill.warn{
      color:#fde68a;
      border-color:rgba(250,204,21,.36);
      background:rgba(250,204,21,.10);
    }

    .pill.bad{
      color:#fecaca;
      border-color:rgba(251,113,133,.36);
      background:rgba(251,113,133,.10);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:10px;
    }

    .btn{
      flex:1 1 210px;
      min-height:50px;
      padding:12px 14px;
      border-radius:14px;
      font-weight:950;
      border:none;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition:transform .12s ease, filter .12s ease, opacity .12s ease;
      font-family:inherit;
      font-size:1rem;
    }

    .btn:hover:not(:disabled){
      transform:translateY(-1px);
      filter:brightness(1.05);
    }

    .btn:disabled{opacity:.55;cursor:not-allowed}

    .btn.primary{
      background:linear-gradient(135deg, rgba(250,204,21,.96), rgba(245,158,11,.88));
      color:#241300;
      box-shadow:0 8px 22px rgba(250,204,21,.22);
    }

    .btn.good{
      background:linear-gradient(135deg, rgba(34,197,94,.95), rgba(16,185,129,.85));
      color:#042012;
      box-shadow:0 8px 22px rgba(34,197,94,.24);
    }

    .btn.ghost{
      background:rgba(255,255,255,.08);
      border:1px solid var(--line);
      color:var(--text);
    }

    .qrbox{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      border-radius:18px;
      border:1px dashed rgba(250,204,21,0.35);
      background:rgba(0,0,0,0.14);
      margin-top:14px;
      min-height:260px;
      text-align:center;
    }

    .qrImg{
      max-width:100%;
      width:330px;
      height:auto;
      border-radius:16px;
      background:#fff;
      padding:12px;
      display:none;
      border:1px solid rgba(148,163,184,.22);
    }

    .empty{
      color:#13200d;
      background:#fff;
      border-radius:16px;
      padding:18px;
      font-weight:1000;
      line-height:1.4;
      max-width:34ch;
    }

    .label{
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(0,0,0,0.14);
      line-height:1.4;
      word-break:break-all;
      color:#d1fae5;
      font-size:.93rem;
      font-weight:850;
    }

    .note{
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      display:none;
      white-space:pre-wrap;
      line-height:1.45;
      font-weight:850;
    }

    .note.ok{display:block;border-color:rgba(34,197,94,.35);color:#bbf7d0;background:rgba(34,197,94,.08)}
    .note.bad{display:block;border-color:rgba(251,113,133,.35);color:#fecaca;background:rgba(251,113,133,.08)}
    .note.warn{display:block;border-color:rgba(250,204,21,.35);color:#fde68a;background:rgba(250,204,21,.08)}

    .mini{
      margin-top:12px;
      color:var(--muted);
      font-size:.9rem;
      font-weight:800;
      line-height:1.4;
      white-space:pre-wrap;
    }

    @media(max-width:680px){
      .wrap{padding:14px;padding-top:76px;padding-bottom:84px}
      .qrImg{width:270px}
      .btn{flex:1 1 100%}
      .back{left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
    }
  </style>
</head>

<body>
  <a id="btnBack" href="./hub.html" class="back">← Retour BUILD</a>

  <div class="wrap">
    <div class="hero">
      <div class="kicker">DIGIY BUILD · QR fiche</div>
      <h1 id="titleBox">QR fiche artisan</h1>
      <p id="subBox">Un QR propre pour faire circuler la fiche : WhatsApp, affiche, sticker, vitrine, carte ou chantier.</p>
    </div>

    <div class="card">
      <div class="pillRow">
        <div class="pill warn" id="pillSession">session…</div>
        <div class="pill" id="pillMetier">métier : —</div>
        <div class="pill" id="pillVille">zone : —</div>
        <div class="pill">fiche publique</div>
      </div>

      <div class="row">
        <button class="btn primary" id="btnCopy" type="button">📋 Copier le lien</button>
        <button class="btn ghost" id="btnShare" type="button">📤 Partager</button>
        <button class="btn good" id="btnOpen" type="button">↗️ Ouvrir la fiche</button>
      </div>

      <div class="row">
        <button class="btn primary" id="btnDownload" type="button">⬇️ Télécharger le QR (PNG)</button>
        <button class="btn ghost" id="btnSticker" type="button">🟩 Télécharger le sticker XL</button>
        <button class="btn ghost" id="btnRefresh" type="button">🔄 Relire session</button>
      </div>

      <div class="qrbox">
        <a id="qrAnchor" href="#" target="_blank" rel="noopener">
          <img id="qrImg" class="qrImg" alt="QR DIGIY BUILD fiche artisan"/>
        </a>
        <div id="emptyBox" class="empty">Lecture de la session BUILD…</div>
      </div>

      <div class="label" id="urlBox">Lien : —</div>
      <div class="note warn" id="note"></div>
      <div class="mini" id="dbg">QR neutre · fiche artisan BUILD · sans métier imposé</div>
    </div>
  </div>

  <script>
    (async function(){
      "use strict";

      const MODULE = "BUILD";
      const TABLES = ["digiy_build_public_profiles", "digiy_build_pros"];
      const PRO_BLOCKED_PATHS = [
        "pin.html","cockpit.html","dashboard","dashboard-pro","hub.html","session.html",
        "admin","abos","pay.html"
      ];

      const SESSION_KEYS = [
        "digiy_build_session",
        "digiy_build_guard_session",
        "digiy_guard_build_session",
        "DIGIY_BUILD_ACCESS",
        "DIGIY_PRO_BUILD_ACCESS",
        "DIGIY_ACCESS",
        "DIGIY_MODULE_ACCESS"
      ];

      const SLUG_KEYS = [
        "digiy_build_last_slug",
        "digiy_build_slug",
        "digiy_last_slug",
        "DIGIY_BUILD_SLUG",
        "DIGIY_CURRENT_SLUG",
        "DIGIY_SLUG",
        "digiy_slug"
      ];

      const PHONE_KEYS = [
        "digiy_build_phone",
        "digiy_build_last_phone",
        "DIGIY_BUILD_PHONE",
        "DIGIY_PHONE",
        "digiy_phone"
      ];

      const qs = new URLSearchParams(location.search);

      const qrImg = document.getElementById("qrImg");
      const emptyBox = document.getElementById("emptyBox");
      const qrAnchor = document.getElementById("qrAnchor");
      const urlBox = document.getElementById("urlBox");
      const noteEl = document.getElementById("note");
      const titleBox = document.getElementById("titleBox");
      const subBox = document.getElementById("subBox");
      const pillMetier = document.getElementById("pillMetier");
      const pillVille = document.getElementById("pillVille");
      const pillSession = document.getElementById("pillSession");

      const btnCopy = document.getElementById("btnCopy");
      const btnShare = document.getElementById("btnShare");
      const btnOpen = document.getElementById("btnOpen");
      const btnDownload = document.getElementById("btnDownload");
      const btnSticker = document.getElementById("btnSticker");
      const btnRefresh = document.getElementById("btnRefresh");

      let targetUrl = "";
      let title = "Fiche artisan DIGIYLYFE";
      let metier = "Artisan tout corps de métiers";
      let ville = "Zone à préciser";
      let qrNormalDataUrl = "";
      let qrXLDataUrl = "";

      function note(msg, type){
        noteEl.className = "note " + (type || "warn");
        noteEl.textContent = msg || "";
        noteEl.style.display = msg ? "block" : "none";
      }

      function setBusy(on){
        [btnCopy,btnShare,btnOpen,btnDownload,btnSticker,btnRefresh].forEach(b => b.disabled = !!on);
      }

      function normalizeSlug(value){
        return String(value || "")
          .trim()
          .replace(/^['"]+|['"]+$/g, "")
          .replace(/\s+/g, "-")
          .replace(/[^a-zA-Z0-9._-]/g, "");
      }

      function onlyDigits(v){
        return String(v || "").replace(/\D/g,"");
      }

      function readRaw(storage, key){
        try{ return storage.getItem(key); }catch(_){ return ""; }
      }

      function readJson(storage, key){
        try{ return JSON.parse(readRaw(storage, key) || "null"); }catch(_){ return null; }
      }

      function moduleLooksBuild(v){
        const m = String(v || "").trim().toUpperCase().replace(/[-\s]/g,"_");
        return m === "BUILD" || m === "PRO_BUILD" || m === "BATISSEUR" || m === "BÂTISSEUR" || m === "PRO_BATISSEUR";
      }

      function isProUrl(value){
        try{
          const u = new URL(value, location.href);
          const low = (u.pathname + " " + u.search + " " + u.hash).toLowerCase();
          return PRO_BLOCKED_PATHS.some(p => low.includes(p.toLowerCase()));
        }catch(_){
          return true;
        }
      }

      function cleanPublicUrl(value){
        const raw = String(value || "").trim();
        if(!raw) return "";
        try{
          const u = new URL(raw, location.href);
          if(!/^https?:$/i.test(u.protocol)) return "";
          if(isProUrl(u.toString())) return "";
          return u.toString();
        }catch(_){
          return "";
        }
      }

      function firstStorage(keys, normalizer){
        for(const storage of [sessionStorage, localStorage]){
          for(const key of keys){
            const raw = readRaw(storage, key);
            const value = normalizer ? normalizer(raw) : raw;
            if(value) return { value, key };
          }
        }
        return { value:"", key:"" };
      }

      function readSession(){
        for(const storage of [sessionStorage, localStorage]){
          for(const key of SESSION_KEYS){
            const s = readJson(storage, key);
            if(!s) continue;

            const slug = normalizeSlug(s.slug || s.pro_slug || s.build_slug || "");
            const phone = onlyDigits(s.phone || s.owner_phone || s.tel || s.whatsapp || "");
            const mod = s.module || s.pin_module || "";
            const access = s.access === true || s.access_ok === true || s.ok === true;

            if((slug || phone) && (!mod || moduleLooksBuild(mod))){
              return { slug, phone, module:mod, access, source:key, raw:s };
            }
          }
        }
        return null;
      }

      function readIdentity(){
        const url = cleanPublicUrl(qs.get("url") || qs.get("u") || qs.get("target") || "");
        if(url){
          return {
            publicUrl:url,
            slug:normalizeSlug(qs.get("slug") || ""),
            phone:"",
            source:"url",
            access:true
          };
        }

        const session = readSession();
        const slugKey = firstStorage(SLUG_KEYS, normalizeSlug);
        const phoneKey = firstStorage(PHONE_KEYS, onlyDigits);

        return {
          publicUrl:"",
          slug: session?.slug || slugKey.value || normalizeSlug(qs.get("slug") || ""),
          phone: session?.phone || phoneKey.value || "",
          source: session?.source || slugKey.key || phoneKey.key || "aucune session",
          access: !!session?.access
        };
      }

      function getSupabase(){
        if(!window.supabase?.createClient) return null;
        const url = window.DIGIY_SUPABASE_URL;
        const key = window.DIGIY_SUPABASE_ANON_KEY || window.DIGIY_SUPABASE_ANON;
        if(!url || !key) return null;
        return window.supabase.createClient(url, key, {
          auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}
        });
      }

      async function queryTable(client, table, identity){
        if(!client) return null;

        const select = table === "digiy_build_public_profiles"
          ? "slug,slug_key,phone,display_name,city,whatsapp,profile_url,is_active,is_published,updated_at"
          : "slug,phone,is_active,updated_at";

        const filters = [];
        if(identity.slug){
          if(table === "digiy_build_public_profiles"){
            filters.push("slug.eq." + identity.slug, "slug_key.eq." + identity.slug);
          }else{
            filters.push("slug.eq." + identity.slug);
          }
        }
        if(identity.phone){
          filters.push("phone.eq." + identity.phone);
        }
        if(!filters.length) return null;

        const { data, error } = await client
          .from(table)
          .select(select)
          .or(filters.join(","))
          .order("updated_at", { ascending:false })
          .limit(1);

        if(error){
          console.warn("[QR BUILD]", table, error);
          return null;
        }

        return Array.isArray(data) && data.length ? data[0] : null;
      }

      function publicUrlFromRow(row){
        if(!row) return "";

        /*
          DOCTRINE MOULE BUILD :
          Le QR commun ne doit jamais imposer une fiche métier spécifique
          comme solaire, hôtel, plomberie, etc.
          Il pointe toujours vers la fiche BUILD publique du pro courant.
          Si un pro a un site externe dédié, il peut le mettre dans sa fiche,
          mais le QR du moule reste la porte neutre : ./fiche.html?slug=...
        */
        const slug = normalizeSlug(row.slug_key || row.slug || "");
        if(!slug) return "";

        const u = new URL("./fiche.html", location.href);
        u.searchParams.set("slug", slug);
        return cleanPublicUrl(u.toString());
      }

      function applyMeta(row, identity){
        title = qs.get("title") || row?.display_name || row?.title || "Fiche artisan DIGIYLYFE";
        metier = qs.get("metier") || row?.metier || row?.profession || "Artisan tout corps de métiers";
        ville = qs.get("ville") || row?.city || row?.zone || "Zone à préciser";

        titleBox.textContent = title;
        subBox.textContent = `${metier}${ville ? " · " + ville : ""}. QR prêt à partager ou imprimer.`;
        pillMetier.textContent = "métier : " + metier;
        pillVille.textContent = "zone : " + ville;

        const ok = !!(identity.slug || identity.phone || identity.publicUrl);
        pillSession.textContent = ok ? "session BUILD lue" : "session absente";
        pillSession.className = "pill " + (ok ? "ok" : "bad");
      }

      async function copyText(value){
        if(navigator.clipboard?.writeText){
          return navigator.clipboard.writeText(value);
        }
        const ta = document.createElement("textarea");
        ta.value = value;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        if(!ok) throw new Error("copy_failed");
      }

      function directDownload(dataUrl, filename){
        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      function makeQrDataUrl(value, size){
        return new Promise((resolve, reject) => {
          if(!window.QRCode?.toDataURL){
            reject(new Error("QRCode lib missing"));
            return;
          }
          window.QRCode.toDataURL(value, {
            width:size,
            margin:1,
            errorCorrectionLevel:"M",
            color:{dark:"#111827", light:"#FFFFFF"}
          }, (err, dataUrl) => err ? reject(err) : resolve(dataUrl));
        });
      }

      function fallbackQrApi(size){
        const u = new URL("https://api.qrserver.com/v1/create-qr-code/");
        u.searchParams.set("size", `${size}x${size}`);
        u.searchParams.set("margin", "16");
        u.searchParams.set("data", targetUrl);
        return u.toString();
      }

      function renderEmpty(message){
        qrImg.style.display = "none";
        qrImg.removeAttribute("src");
        emptyBox.style.display = "block";
        emptyBox.textContent = message || "Fiche publique non trouvée.";
        qrAnchor.href = "#";
        urlBox.textContent = "Lien : —";
        targetUrl = "";
        note(message || "Fiche publique non trouvée.", "bad");
      }

      async function renderQr(){
        if(!targetUrl){
          renderEmpty("Aucun lien public BUILD trouvé. Repasse par le PIN ou vérifie la fiche artisan.");
          return;
        }

        qrAnchor.href = targetUrl;
        urlBox.textContent = "Lien : " + targetUrl;
        emptyBox.style.display = "none";
        qrImg.style.display = "block";

        setBusy(true);
        note("⏳ Préparation du QR…", "warn");

        try{
          qrNormalDataUrl = await makeQrDataUrl(targetUrl, 560);
          qrXLDataUrl = await makeQrDataUrl(targetUrl, 980);
          qrImg.src = qrNormalDataUrl;
          note("✅ QR prêt. Teste-le au téléphone avant impression.", "ok");
        }catch(e){
          console.warn(e);
          qrNormalDataUrl = fallbackQrApi(560);
          qrXLDataUrl = fallbackQrApi(980);
          qrImg.src = qrNormalDataUrl;
          note("✅ QR prêt avec générateur externe.", "ok");
        }finally{
          setBusy(false);
        }
      }

      async function boot(){
        qrNormalDataUrl = "";
        qrXLDataUrl = "";
        targetUrl = "";

        const identity = readIdentity();
        applyMeta(null, identity);

        document.getElementById("dbg").textContent =
          "source : " + identity.source + "\n" +
          "slug : " + (identity.slug || "—") + "\n" +
          "phone : " + (identity.phone ? "présent" : "—");

        if(identity.publicUrl){
          targetUrl = identity.publicUrl;
          await renderQr();
          return;
        }

        if(!identity.slug && !identity.phone){
          renderEmpty("Aucune session BUILD trouvée. Ouvre d’abord le module par PIN, puis reviens sur QR.");
          return;
        }

        const client = getSupabase();
        if(!client){
          renderEmpty("Supabase indisponible. Impossible de retrouver la fiche publique BUILD.");
          return;
        }

        let row = null;
        for(const table of TABLES){
          row = await queryTable(client, table, identity);
          if(row) break;
        }

        applyMeta(row, identity);
        targetUrl = publicUrlFromRow(row);

        if(!targetUrl){
          renderEmpty("Session BUILD lue, mais aucune fiche publique n’est reliée à ce slug/téléphone.");
          return;
        }

        await renderQr();
      }

      btnCopy.onclick = async () => {
        if(!targetUrl) return note("Aucun lien à copier.", "bad");
        try{
          await copyText(targetUrl);
          note("✅ Lien copié.", "ok");
        }catch(_){
          window.prompt("Copie le lien :", targetUrl);
        }
      };

      btnShare.onclick = async () => {
        if(!targetUrl) return note("Aucun lien à partager.", "bad");
        try{
          if(navigator.share){
            await navigator.share({title, text:`${metier} · ${ville}`, url:targetUrl});
            return;
          }
        }catch(_){}
        btnCopy.click();
      };

      btnOpen.onclick = () => {
        if(!targetUrl) return note("Aucun lien prêt.", "bad");
        window.open(targetUrl, "_blank", "noopener");
      };

      btnDownload.onclick = () => {
        if(!qrNormalDataUrl) return note("❌ QR non prêt.", "bad");
        directDownload(qrNormalDataUrl, "DIGIY_QR_BUILD_FICHE.png");
        note("⬇️ Téléchargement lancé.", "ok");
      };

      btnSticker.onclick = () => {
        if(!qrXLDataUrl) return note("❌ Sticker non prêt.", "bad");
        directDownload(qrXLDataUrl, "DIGIY_STICKER_XL_BUILD_FICHE.png");
        note("⬇️ Sticker XL téléchargé.", "ok");
      };

      btnRefresh.onclick = boot;

      boot();
    })();
  </script>
</body>
</html>
