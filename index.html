<!doctype html>

<head>

  <title>Mes services — Entrée</title>

  <meta name="theme-color" content="#1e7a46"/>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet"/>

  <script>
    window.DIGIY_MODULE="BUILD";
    window.DIGIY_LOGIN_URL="./pin.html";

    (()=>{
      "use strict";

      const TARGET="./hub.html";
      const SENSITIVE=[
        "phone","tel","owner_phone","owner_id","slug","module",
        "return","redirect","redirect_url","url","from","v",
        "pin","token","session_token"
      ];

      function clean(){
        try{
          const u=new URL(location.href);
          let c=false;

          SENSITIVE.forEach(k=>{
            if(u.searchParams.has(k)){
              u.searchParams.delete(k);
              c=true;
            }
          });

          if(c){
            history.replaceState({},document.title,u.pathname+u.search+u.hash);
          }
        }catch(_){}
      }

      clean();

      setTimeout(()=>{
        location.replace(TARGET+(location.hash||""));
      },520);
    })();
  </script>

    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1e7a46;color:#f0fff5;font-family:system-ui;padding:18px}

    h1{font-size:clamp(38px,8vw,58px);line-height:.95;margin:10px 0;font-weight:1000}

  </style>
