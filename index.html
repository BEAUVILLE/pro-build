<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>

  <meta name="digiy-build" content="build-simple-hub-v1-20260715"/>

  <script>
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_SUPABASE_KEY = window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_MODULE = "BUILD";

    window.DIGIY_LOGIN_URL = "./pin.html";

  <style>
    :root{
      color-scheme:light;
      --bg:#eadfc8;
      --bg2:#fff8ea;
      --card:rgba(255,250,240,.95);
      --line:rgba(16,37,28,.14);
      --text:#10251c;
      --green:#22c55e;
      --green-dark:#0e4226;
      --gold:#c4973f;
      --gold-soft:#fff0a8;
      --shadow:0 24px 70px rgba(6,59,43,.20);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}

    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:22px;
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(780px 460px at 8% -10%,rgba(34,197,94,.20),transparent 60%),
        radial-gradient(720px 430px at 108% 5%,rgba(196,151,63,.28),transparent 56%),
        linear-gradient(180deg,var(--bg2),var(--bg));
    }

    main{
      width:min(480px,100%);
      padding:24px;
      border:1px solid var(--line);
      border-radius:28px;
      background:var(--card);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    h1{
      margin:0 0 22px;
      color:var(--green-dark);
      font-size:clamp(2rem,9vw,3rem);
      line-height:1.02;
      letter-spacing:-.045em;
    }

    nav{display:grid;gap:12px}

    a,button{
      width:100%;
      min-height:62px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px 18px;
      border:1px solid var(--line);
      border-radius:18px;
      color:var(--text);
      background:rgba(255,255,255,.80);
      font:inherit;
      font-size:1rem;
      font-weight:950;
      text-align:center;
      text-decoration:none;
      cursor:pointer;
      transition:transform .14s ease,background .14s ease,border-color .14s ease;
    }

    a:first-child{
      color:#052012;
      border-color:transparent;
      background:linear-gradient(135deg,var(--green),#bbf7d0);
    }

    a:nth-child(3){
      color:#2d2308;
      border-color:rgba(196,151,63,.32);
      background:linear-gradient(135deg,var(--gold-soft),var(--gold));
    }

    a:hover,button:hover{
      transform:translateY(-1px);
      border-color:rgba(16,37,28,.28);
      background:#fff;
    }

    a:active,button:active{transform:none}

    #status{
      margin:14px 0 0;
      padding:11px 12px;
      border:1px solid rgba(196,151,63,.32);
      border-radius:14px;
      color:#6b4f00;
      background:rgba(255,240,168,.30);
      font-size:.88rem;
      font-weight:850;
      line-height:1.4;
    }

    #status[hidden]{display:none}

    @media(max-width:420px){
      body{padding:14px}
      main{padding:19px;border-radius:23px}
      h1{margin-bottom:18px}
      a,button{min-height:58px}
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/digiy-abos-access.js?v=abos-20260522"></script>
  <script src="./guard.js?v=build-guard-simple-20260603" onerror="location.replace('./pin.html?reason=guard_missing')"></script>

  <main>
    <h1>Bonjour artisan.</h1>

    <nav aria-label="Actions artisan BUILD">
      <a href="./atelier.html">Mon travail</a>
      <a href="./fiche.html">Ma fiche artisan</a>
      <a href="./qr.html">Mon QR artisan</a>
      <button id="shareWhatsApp" type="button">Partager sur WhatsApp</button>
    </nav>

    <p id="status" role="status" aria-live="polite" hidden></p>
  </main>

  <script>
    (() => {
      "use strict";

      const shareButton = document.getElementById("shareWhatsApp");
      const statusBox = document.getElementById("status");
      const FALLBACK_PUBLIC_URL = "https://build.digiylyfe.com/";

      const SESSION_KEYS = [
        "digiy_build_session",
        "digiy_build_guard_session",
        "digiy_guard_build_session",
        "DIGIY_BUILD_ACCESS",
        "DIGIY_PRO_BUILD_ACCESS",
        "DIGIY_ACCESS",
        "DIGIY_MODULE_ACCESS"
      ];

      const SLUG_KEYS = [
        "digiy_build_last_slug",
        "digiy_build_slug",
        "digiy_last_slug",
        "DIGIY_BUILD_SLUG",
        "DIGIY_CURRENT_SLUG",
        "DIGIY_SLUG",
        "digiy_slug"
      ];

      function setStatus(message){
        statusBox.textContent = message || "";
        statusBox.hidden = !message;
      }

      function safeGet(storage,key){
        try{return storage.getItem(key) || ""}catch(_){return ""}
      }

      function safeJson(raw){
        try{return JSON.parse(raw || "null")}catch(_){return null}
      }

      function cleanSlug(value){
        return String(value || "")
          .trim()
          .replace(/^['\"]+|['\"]+$/g,"")
          .replace(/\s+/g,"-")
          .replace(/[^a-zA-Z0-9._-]/g,"");
      }

      function cleanPublicUrl(value){
        const raw=String(value || "").trim();
        if(!raw)return "";
        try{
          const url=new URL(raw,location.href);
          if(!/^https?:$/i.test(url.protocol))return "";
          const low=(url.pathname+" "+url.search+" "+url.hash).toLowerCase();
          if(["pin.html","atelier.html","cockpit.html","hub.html","session.html","admin"].some(p=>low.includes(p)))return "";
          return url.toString();
        }catch(_){return ""}
      }

      function resolvePublicUrl(){
        for(const storage of [sessionStorage,localStorage]){
          for(const key of SESSION_KEYS){
            const session=safeJson(safeGet(storage,key));
            if(!session)continue;
            const direct=cleanPublicUrl(session.public_url || session.profile_url || session.fiche_url || session.url || "");
            if(direct)return direct;
            const slug=cleanSlug(session.slug || session.pro_slug || session.build_slug || "");
            if(slug){
              const url=new URL("./fiche.html",location.href);
              url.searchParams.set("slug",slug);
              return url.toString();
            }
          }
        }

        for(const storage of [sessionStorage,localStorage]){
          for(const key of SLUG_KEYS){
            const slug=cleanSlug(safeGet(storage,key));
            if(slug){
              const url=new URL("./fiche.html",location.href);
              url.searchParams.set("slug",slug);
              return url.toString();
            }
          }
        }

        return FALLBACK_PUBLIC_URL;
      }

      shareButton.addEventListener("click",()=>{
        const publicUrl=resolvePublicUrl();
        const message="Bonjour, voici ma fiche artisan DIGIY BUILD : "+publicUrl;
        setStatus("Ouverture de WhatsApp…");
        location.href="https://wa.me/?text="+encodeURIComponent(message);
      });
    })();
  </script>
</body>
</html>
