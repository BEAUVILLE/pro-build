<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Accès BUILD • DIGIY</title>
  <meta name="theme-color" content="#020617">
  <meta name="digiy-build-pin" content="build-pin-v7-20260722">
  <script>
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_MODULE = "BUILD";
    window.DIGIY_MODULE_LABEL = "Je bâtis";
    window.DIGIY_MODULE_ICON = "🧰";
    window.DIGIY_SLUG_PREFIX = "build";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#1e293b;--bg2:#334155;--line:rgba(148,163,184,.22);--ink:#f9fafb;--muted:#94a3b8;--gold:#facc15;--green:#22c55e;--red:#ef4444}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100dvh;display:grid;place-items:center;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(800px 500px at 15% -5%,rgba(250,204,21,.13),transparent 55%),radial-gradient(700px 400px at 88% 5%,rgba(34,197,94,.10),transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg))}
    .card{width:min(420px,100%);padding:26px 22px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.035);box-shadow:0 28px 70px rgba(0,0,0,.45)}
    .head{text-align:center;margin-bottom:20px}.icon{font-size:38px}.badge{display:inline-flex;margin:9px 0 7px;padding:5px 12px;border:1px solid rgba(250,204,21,.30);border-radius:999px;color:#fde68a;background:rgba(250,204,21,.08);font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}.title{font-size:1.35rem;font-weight:1000}
    .panel{display:none}.panel.active{display:block}
    label{display:block;margin-bottom:7px;color:var(--muted);font-size:.78rem;font-weight:950;letter-spacing:.04em;text-transform:uppercase}
    input{width:100%;min-height:54px;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:rgba(0,0,0,.22);color:var(--ink);font:inherit;font-size:1.05rem;font-weight:900;outline:none}
    input:focus{border-color:rgba(250,204,21,.55);box-shadow:0 0 0 3px rgba(250,204,21,.09)}
    .recap{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;padding:11px 13px;border:1px solid rgba(34,197,94,.25);border-radius:13px;background:rgba(34,197,94,.06);color:#86efac;font-weight:950}
    .linkbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:.78rem;font-weight:900;text-decoration:underline;cursor:pointer}
    .dots{display:flex;justify-content:center;gap:16px;margin:12px 0 22px}.dot{width:20px;height:20px;border:2px solid rgba(148,163,184,.32);border-radius:50%}.dot.on{border-color:var(--gold);background:var(--gold);transform:scale(1.1)}.dot.bad{border-color:var(--red);background:rgba(239,68,68,.22)}
    .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.key{min-height:58px;border:1px solid rgba(148,163,184,.20);border-radius:14px;background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:1.3rem;font-weight:1000;cursor:pointer}.key:active{transform:scale(.95)}.key.zero{grid-column:2}.key.del{font-size:1rem;color:var(--muted)}
    .btn{width:100%;min-height:53px;margin-top:15px;border:1px solid rgba(250,204,21,.35);border-radius:16px;background:linear-gradient(135deg,rgba(250,204,21,.24),rgba(34,197,94,.20));color:#fff;font:inherit;font-weight:1000;cursor:pointer}.btn:disabled{opacity:.42;cursor:not-allowed}
    .status{display:none;margin-top:12px;padding:11px 13px;border-radius:13px;font-size:.85rem;font-weight:900;line-height:1.48;white-space:pre-wrap}.status.show{display:block}.status.spin{color:var(--muted);border:1px solid var(--line);background:rgba(148,163,184,.07)}.status.ok{color:#bbf7d0;border:1px solid rgba(34,197,94,.3);background:rgba(34,197,94,.09)}.status.err{color:#fecaca;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.09)}
    .note{margin-top:18px;text-align:center;color:rgba(148,163,184,.62);font-size:.74rem;font-weight:800;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <header class="head">
      <div class="icon">🧰</div>
      <div class="badge">🔑 Accès DIGIY</div>
      <div class="title">Je bâtis</div>
    </header>

    <section class="panel active" id="phonePanel">
      <label for="phone">Ton numéro de téléphone</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="221 77 XXX XX XX" maxlength="16">
      <button class="btn" id="continue" type="button" disabled>Continuer →</button>
      <div class="status" id="phoneStatus" role="status"></div>
    </section>

    <section class="panel" id="pinPanel">
      <div class="recap"><span id="phoneDisplay"></span><button class="linkbtn" id="back" type="button">Modifier</button></div>
      <label>Ton code secret (4 chiffres)</label>
      <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="keypad" id="keypad">
        <button class="key" data-key="1" type="button">1</button><button class="key" data-key="2" type="button">2</button><button class="key" data-key="3" type="button">3</button>
        <button class="key" data-key="4" type="button">4</button><button class="key" data-key="5" type="button">5</button><button class="key" data-key="6" type="button">6</button>
        <button class="key" data-key="7" type="button">7</button><button class="key" data-key="8" type="button">8</button><button class="key" data-key="9" type="button">9</button>
        <button class="key zero" data-key="0" type="button">0</button><button class="key del" data-key="DEL" type="button">⌫</button>
      </div>
      <button class="btn" id="enter" type="button" disabled>Entrer →</button>
      <div class="status" id="pinStatus" role="status"></div>
    </section>

    <div class="note">Ton numéro et ton code ne sont jamais partagés.<br>DIGIY BUILD · 0% commission · relation directe</div>
  </main>

<script>
(()=>{
  "use strict";

  const MODULE = "BUILD";
  const MAX_AGE = 8 * 60 * 60 * 1000;
  const MODULE_VARIANTS = [...new Set([
    "BUILD","build",
    "PRO_BUILD","pro_build",
    "BUILD_PRO","build_pro",
    "PRO-BUILD","pro-build",
    "MES_SERVICES","mes_services",
    "SERVICES","services",
    "BATISSEUR","batisseur",
    "BÂTISSEUR","bâtisseur",
    "PRO_BATISSEUR","pro_batisseur",
    "PRO-BATISSEUR","pro-batisseur"
  ])];

  const SESSION_KEYS = [
    "digiy_build_session",
    "digiy_build_guard_session",
    "digiy_guard_build_session",
    "DIGIY_BUILD_ACCESS",
    "DIGIY_PRO_BUILD_ACCESS",
    "DIGIY_ACCESS",
    "DIGIY_MODULE_ACCESS"
  ];
  const PHONE_KEYS = [
    "digiy_build_phone","digiy_build_last_phone",
    "DIGIY_BUILD_PHONE","DIGIY_PHONE","digiy_phone"
  ];
  const SLUG_KEYS = [
    "digiy_build_slug","digiy_build_last_slug","digiy_last_slug",
    "DIGIY_BUILD_SLUG","DIGIY_CURRENT_SLUG","DIGIY_PRO_SLUG","DIGIY_SLUG","digiy_slug"
  ];

  const $ = id => document.getElementById(id);
  const dots = [...document.querySelectorAll(".dot")];
  let pin = "";
  let confirmedPhone = "";
  let busy = false;
  let client = null;

  const digits = value => String(value || "").replace(/\D/g,"");
  const cleanSlug = value => String(value || "").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g,"-").replace(/[^a-z0-9._-]/g,"")
    .replace(/-+/g,"-").replace(/^-|-$/g,"");

  function canonicalPhone(value){
    const d = digits(value);
    if(d.length === 9) return "221" + d;
    if(d.length === 10 && d.startsWith("0")) return "221" + d.slice(1);
    return d;
  }

  function phoneVariants(value){
    const d = digits(value);
    const values = [];
    const add = v => { v = digits(v); if(v && !values.includes(v)) values.push(v); };
    add(d);
    if(d.length === 9) add("221" + d);
    if(d.length === 12 && d.startsWith("221")) add(d.slice(3));
    if(d.length === 10 && d.startsWith("0")){ add(d.slice(1)); add("221" + d.slice(1)); }
    return values;
  }

  function setStatus(id,message,type){
    const el = $(id);
    el.textContent = message || "";
    el.className = "status" + (message ? " show " + (type || "") : "");
  }

  function updateDots(error=false){
    dots.forEach((dot,index)=>{
      dot.classList.toggle("on", index < pin.length);
      dot.classList.toggle("bad", error);
    });
    $("enter").disabled = busy || pin.length !== 4;
  }

  function showPin(){
    $("phonePanel").classList.remove("active");
    $("pinPanel").classList.add("active");
    $("phoneDisplay").textContent = confirmedPhone;
    pin = "";
    updateDots();
  }

  function showPhone(){
    $("pinPanel").classList.remove("active");
    $("phonePanel").classList.add("active");
    pin = "";
    busy = false;
    updateDots();
    setStatus("pinStatus","","");
  }

  function getClient(){
    if(client) return client;
    if(!window.supabase?.createClient) throw new Error("Librairie Supabase absente");
    client = window.supabase.createClient(
      window.DIGIY_SUPABASE_URL,
      window.DIGIY_SUPABASE_ANON_KEY,
      {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}
    );
    return client;
  }

  function positive(value){
    if(value === true || value === 1) return true;
    return ["true","t","1","ok","active","allowed","valid","verified","granted"]
      .includes(String(value || "").trim().toLowerCase());
  }

  function moduleLooksBuild(value){
    const code = String(value || "").trim().toUpperCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[_-]+/g," ").replace(/\s+/g," ");
    return ["BUILD","PRO BUILD","BUILD PRO","MES SERVICES","SERVICES","BATISSEUR","PRO BATISSEUR"].includes(code);
  }

  function parseVerify(data,fallbackPhone){
    let row = Array.isArray(data) ? data[0] : data;
    if(positive(row)) return {ok:true,phone:canonicalPhone(fallbackPhone),slug:"",token:""};

    if(typeof row === "string"){
      const text = row.trim();
      if(positive(text)) return {ok:true,phone:canonicalPhone(fallbackPhone),slug:"",token:""};
      if(text.startsWith("(") && text.endsWith(")")){
        const parts = text.slice(1,-1).split(",");
        if(positive(parts[0])){
          const second = String(parts[1] || "").trim();
          return {
            ok:true,
            phone:canonicalPhone(parts[2] || fallbackPhone),
            slug:moduleLooksBuild(second) ? "" : cleanSlug(second),
            token:String(parts[3] || "").trim()
          };
        }
      }
      try{ row = JSON.parse(text); }catch(_){ return null; }
    }

    if(!row || typeof row !== "object") return null;
    if(row.data && typeof row.data === "object") row = row.data;
    if(row.result && typeof row.result === "object") row = row.result;

    const keys = ["ok","success","valid","is_valid","verified","authenticated","allowed","access","access_ok","has_access","can_access","digiy_verify_pin"];
    const hasDecision = keys.some(key => Object.prototype.hasOwnProperty.call(row,key));
    const ok = hasDecision
      ? keys.some(key => positive(row[key]))
      : positive(Object.values(row)[0]) || positive(row.active) || positive(row.is_active) || ["ok","active","allowed","valid"].includes(String(row.status || "").toLowerCase());

    if(!ok) return null;
    return {
      ok:true,
      phone:canonicalPhone(row.phone || row.p_phone || row.owner_phone || fallbackPhone),
      slug:cleanSlug(row.slug || row.identifiant || row.build_slug || row.owner_slug || ""),
      token:String(row.session_token || row.token || "").trim()
    };
  }

  function parseAccess(data){
    let row = Array.isArray(data) ? data[0] : data;
    if(positive(row)) return true;
    if(!row || typeof row !== "object") return false;
    if(Object.prototype.hasOwnProperty.call(row,"data")) return parseAccess(row.data);
    if(Object.prototype.hasOwnProperty.call(row,"result")) return parseAccess(row.result);
    return ["ok","success","active","is_active","allowed","access","access_ok","has_access","can_access"]
      .some(key => positive(row[key]));
  }

  async function verifyByPhone(sb,phone,code){
    let hadResponse = false;
    let lastError = null;

    for(const candidatePhone of phoneVariants(phone)){
      const attempts = await Promise.all(MODULE_VARIANTS.map(async module=>{
        try{
          const {data,error} = await sb.rpc("digiy_verify_pin",{
            p_phone:candidatePhone,
            p_module:module,
            p_pin:code
          });
          return {module,data,error};
        }catch(error){
          return {module,data:null,error};
        }
      }));

      for(const attempt of attempts){
        if(attempt.error){ lastError = attempt.error; continue; }
        hadResponse = true;
        const parsed = parseVerify(attempt.data,candidatePhone);
        if(parsed?.ok){
          return {
            ok:true,
            phone:parsed.phone || canonicalPhone(candidatePhone),
            slug:parsed.slug || "",
            token:parsed.token || "",
            acceptedModule:attempt.module,
            rail:"digiy_verify_pin"
          };
        }
      }
    }

    return {ok:false,hadResponse,lastError};
  }

  async function hasBuildAccess(sb,phone){
    let checked = false;
    const rails = ["digiy_has_access","digiy_has_module_access_from_abos"];

    for(const candidatePhone of phoneVariants(phone)){
      for(const module of MODULE_VARIANTS){
        for(const rpc of rails){
          try{
            const {data,error} = await sb.rpc(rpc,{
              p_phone:candidatePhone,
              p_module:module
            });
            if(error) continue;
            checked = true;
            if(parseAccess(data)) return {found:true,checked:true,rail:rpc,module};
          }catch(_){}
        }
      }
    }
    return {found:false,checked};
  }

  async function verifyCompatible(sb,phone,code){
    const direct = await verifyByPhone(sb,phone,code);
    if(direct.ok) return direct;

    if(!direct.hadResponse && direct.lastError){
      throw new Error(direct.lastError.message || "Erreur serveur");
    }

    const access = await hasBuildAccess(sb,phone);
    return {
      ok:false,
      reason:access.found ? "pin_mismatch" : access.checked ? "no_access" : "unknown"
    };
  }

  function writeBoth(key,value){
    try{localStorage.setItem(key,value)}catch(_){}
    try{sessionStorage.setItem(key,value)}catch(_){}
  }

  function writeSession(result){
    const phone = canonicalPhone(result.phone || confirmedPhone);
    const slug = cleanSlug(result.slug) || `build-${phone}`;
    const now = Date.now();
    const session = JSON.stringify({
      slug,
      phone,
      module:MODULE,
      pin_module:result.acceptedModule || MODULE,
      ts:now,
      validated_at:now,
      verified_at:now,
      expires_at:now + MAX_AGE,
      session_token:String(result.token || ""),
      access:true,
      access_ok:true,
      pin_session_ok:true,
      verification_rail:result.rail || "digiy_verify_pin",
      session_version:"build-pin-v7"
    });

    SESSION_KEYS.forEach(key=>writeBoth(key,session));
    PHONE_KEYS.forEach(key=>writeBoth(key,phone));
    SLUG_KEYS.forEach(key=>writeBoth(key,slug));
  }

  async function login(){
    if(busy || pin.length !== 4) return;
    busy = true;
    updateDots();
    setStatus("pinStatus","⏳ Vérification sécurisée BUILD…","spin");

    try{
      const result = await verifyCompatible(getClient(),confirmedPhone,pin);
      if(!result.ok){
        pin = "";
        busy = false;
        updateDots(true);
        const message =
          result.reason === "pin_mismatch"
            ? "❌ Ton accès PRO BUILD existe, mais ce code ne correspond pas.\nVérifie les 4 chiffres et réessaie."
            : result.reason === "no_access"
            ? "❌ Aucun accès PRO BUILD actif n’est relié à ce numéro.\nUtilise le numéro exact de ton inscription."
            : "❌ Le service n’a pas pu confirmer ton accès PRO BUILD.\nVérifie ta connexion puis réessaie.";
        setStatus("pinStatus",message,"err");
        return;
      }

      writeSession(result);
      setStatus("pinStatus","✅ Accès BUILD ouvert. Redirection…","ok");
      setTimeout(()=>location.replace("./hub.html"),650);
    }catch(error){
      pin = "";
      busy = false;
      updateDots(true);
      setStatus("pinStatus","❌ Erreur : " + (error?.message || "inattendue"),"err");
    }
  }

  $("phone").addEventListener("input",()=>{
    $("continue").disabled = digits($("phone").value).length < 9;
    setStatus("phoneStatus","","");
  });
  $("continue").addEventListener("click",()=>{
    const phone = canonicalPhone($("phone").value);
    if(phone.length < 9){
      setStatus("phoneStatus","❌ Numéro trop court.","err");
      return;
    }
    confirmedPhone = phone;
    showPin();
  });
  $("back").addEventListener("click",showPhone);
  $("keypad").addEventListener("click",event=>{
    const key = event.target.closest("[data-key]");
    if(!key || busy) return;
    const value = key.dataset.key;
    if(value === "DEL") pin = pin.slice(0,-1);
    else if(pin.length < 4) pin += value;
    updateDots();
    setStatus("pinStatus","","");
    if(pin.length === 4) setTimeout(login,100);
  });
  $("enter").addEventListener("click",login);
})();
</script>
</body>
</html>
