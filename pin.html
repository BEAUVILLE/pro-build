  <style>

    .phone-recap{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:12px;border:1px solid rgba(34,197,94,.25);background:rgba(34,197,94,.06);margin-bottom:18px}.phone-recap-num{font-size:.9rem;font-weight:950;color:#86efac}.phone-recap-btn{font-size:.75rem;font-weight:950;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;text-decoration:underline;text-underline-offset:2px}.phone-recap-btn:hover{color:var(--ink)}

    .btn{width:100%;min-height:52px;border-radius:16px;border:1px solid rgba(250,204,21,.35);background:linear-gradient(135deg,rgba(250,204,21,.22),rgba(34,197,94,.18));color:#fff;font-size:1rem;font-weight:1100;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .10s,background .15s;touch-action:manipulation}.btn:hover:not(:disabled){background:linear-gradient(135deg,rgba(250,204,21,.32),rgba(34,197,94,.26))}.btn:active:not(:disabled){transform:scale(.98)}.btn:disabled{opacity:.40;cursor:not-allowed}.status{margin-top:12px;min-height:0;padding:0;border-radius:12px;font-size:.84rem;font-weight:900;line-height:1.5;display:none;white-space:pre-wrap}.status.show{display:block;padding:10px 13px;margin-top:12px}.status.err{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.30);color:#fca5a5}.status.ok{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.30);color:#86efac}.status.spin{background:rgba(148,163,184,.07);border:1px solid var(--line);color:var(--muted)}.note{margin-top:18px;text-align:center;color:rgba(148,163,184,.55);font-size:.74rem;font-weight:800;line-height:1.55}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}.shake{animation:shake .35s ease}

<body>
<div class="card">
  <div class="header"><span class="ico" id="moduleIcon">🧰</span><div class="badge">🔑 Accès DIGIY</div><div class="title" id="moduleLabel">Je bâtis</div></div>
  <div class="steps"><div class="step"><div class="step-dot active" id="dot1">1</div><div class="step-lbl active" id="lbl1">Numéro</div></div><div class="step-connector" id="conn"></div><div class="step"><div class="step-dot" id="dot2">2</div><div class="step-lbl" id="lbl2">Code</div></div></div>
  <div class="panel active" id="step1"><label class="label" for="phoneInput">📱 Ton numéro de téléphone</label><div class="phone-wrap"><span class="phone-flag">🇸🇳</span><input id="phoneInput" class="input" type="tel" inputmode="numeric" placeholder="221 77 XXX XX XX" autocomplete="tel" maxlength="15"/></div><div class="status" id="status1"></div><button class="btn" id="btnContinue" type="button" style="margin-top:16px" disabled>Continuer →</button></div>
  <div class="panel" id="step2"><div class="phone-recap"><span class="phone-recap-num" id="phoneDisplay"></span><button class="phone-recap-btn" id="btnBack" type="button">Modifier</button></div><label class="label">🔢 Ton code secret (4 chiffres)</label><div class="pin-dots" id="pinDots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div><div class="keypad" id="keypad"><button class="key" data-v="1" type="button">1</button><button class="key" data-v="2" type="button">2</button><button class="key" data-v="3" type="button">3</button><button class="key" data-v="4" type="button">4</button><button class="key" data-v="5" type="button">5</button><button class="key" data-v="6" type="button">6</button><button class="key" data-v="7" type="button">7</button><button class="key" data-v="8" type="button">8</button><button class="key" data-v="9" type="button">9</button><button class="key zero" data-v="0" type="button">0</button><button class="key del" data-v="DEL" type="button">⌫</button></div><button class="btn" id="btnEnter" type="button" disabled>Entrer →</button><div class="status" id="status2"></div></div>
  <div class="note">Ton numéro et ton code ne sont jamais partagés.<br>DIGIY BUILD · artisans tout corps de métiers · 100% indépendance ∞</div>
</div>
<script>
(function(){
"use strict";
const MODULE=((window.DIGIY_MODULE)||"BUILD").toUpperCase();
const MODULE_LABEL=window.DIGIY_MODULE_LABEL||MODULE;
const MODULE_ICON=window.DIGIY_MODULE_ICON||"∞";
const SLUG_PREFIX=(window.DIGIY_SLUG_PREFIX||"build").replace(/_/g,"-");
const MAX_AGE=8*60*60*1000;
const MODULE_ALIASES=Array.from(new Set(["pro_build","PRO_BUILD","BUILD","build","pro-build","PRO-BUILD","BUILD_PRO","build_pro","BATISSEUR","batisseur","BÂTISSEUR","bâtisseur","pro_batisseur","PRO_BATISSEUR","pro-batisseur","PRO-BATISSEUR","MES_SERVICES","mes_services","SERVICES","services",MODULE].filter(Boolean)));
const mod=MODULE.toLowerCase();
const SKEYS=[`digiy_${mod}_session`,`digiy_${mod}_guard_session`,`digiy_guard_${mod}_session`];
const PKEYS=[`digiy_${mod}_phone`,`digiy_${mod}_last_phone`,"DIGIY_LOC_HUB_PHONE","digiy_phone"];
const SLKEYS=[`digiy_${mod}_last_slug`,`digiy_${mod}_slug`,"digiy_last_slug"];
const HISTORIC_SLUG_KEYS=["DIGIY_BUILD_SLUG","DIGIY_CURRENT_SLUG","DIGIY_PRO_SLUG","DIGIY_SLUG","digiy_build_slug","digiy_slug","slug"];
const $=id=>document.getElementById(id);
$("moduleLabel").textContent=MODULE_LABEL;$("moduleIcon").textContent=MODULE_ICON;document.title=`Accès ${MODULE_LABEL} • DIGIY`;
let pin="",confirmedPhone="",isLogging=false;
function norm(p){return String(p||"").replace(/\D/g,"")}
function fmt(d){if(d.length===12&&d.startsWith("221"))return`${d.slice(0,3)} ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8,10)} ${d.slice(10)}`;return d}
function slug(p){return SLUG_PREFIX&&p?`${SLUG_PREFIX}-${p}`:""}
function cleanSlug(v){return String(v||"").trim().replace(/^['"]+|['"]+$/g,"").replace(/\s+/g,"-").replace(/[^a-zA-Z0-9._-]/g,"")}
function phoneVariants(p){const d=norm(p),out=[];const add=v=>{v=norm(v);if(v&&!out.includes(v))out.push(v)};add(d);if(d.length===9)add("221"+d);if(d.length===12&&d.startsWith("221"))add(d.slice(3));if(d.length===10&&d.startsWith("0")){add(d.slice(1));add("221"+d.slice(1))}return out}
function qp(n){try{return new URL(location.href).searchParams.get(n)||""}catch(_){return""}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(_){}}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k)||"";sessionStorage.setItem(k,v)}catch(_){}}
function readStoredSlug(key){for(const storage of [localStorage,sessionStorage]){try{const raw=storage.getItem(key)||"",direct=cleanSlug(raw);if(direct&&direct!=="null"&&direct!=="undefined"&&!direct.startsWith("{"))return direct;const parsed=JSON.parse(raw||"null"),nested=cleanSlug(parsed?.slug||parsed?.build_slug||parsed?.pro_slug||"");if(nested)return nested}catch(_){}}return""}
function slugCandidates(phone){const out=[],add=v=>{v=cleanSlug(v);if(v&&!out.includes(v))out.push(v)};["slug","s","pro","id","fiche","build","batisseur"].forEach(name=>add(qp(name)));HISTORIC_SLUG_KEYS.forEach(key=>add(readStoredSlug(key)));for(const p of phoneVariants(phone)){add(`${SLUG_PREFIX}-${p}`);add(`pro-build-${p}`);add(`pro_build-${p}`);add(p)}return out}
function showSt(id,msg,cls){const e=$(id);e.className="status show "+cls;e.textContent=msg}
function clearSt(id){const e=$(id);e.className="status";e.textContent=""}
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");setTimeout(()=>el.classList.remove("shake"),400)}
function getSb(){if(window._dsb)return window._dsb;const url=window.DIGIY_SUPABASE_URL||"",key=window.DIGIY_SUPABASE_ANON_KEY||window.DIGIY_SUPABASE_ANON||"";if(!url||!key)throw new Error("Supabase non configuré");if(!window.supabase?.createClient)throw new Error("Librairie Supabase absente");window._dsb=window.supabase.createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return window._dsb}
function writeSession(phone,sl,token,acceptedModule,rail){const now=Date.now(),sess=JSON.stringify({slug:sl,phone,module:MODULE,pin_module:acceptedModule||MODULE,ts:now,validated_at:now,verified_at:now,expires_at:now+MAX_AGE,session_token:String(token||"").trim(),access:true,access_ok:true,pin_session_ok:true,verification_rail:rail||"phone",session_version:"build-pin-v3"});SKEYS.forEach(k=>{ls(k,sess);ss(k,sess)});["DIGIY_BUILD_ACCESS","DIGIY_PRO_BUILD_ACCESS","DIGIY_ACCESS","DIGIY_MODULE_ACCESS"].forEach(k=>{ls(k,sess);ss(k,sess)});PKEYS.forEach(k=>{ls(k,phone);ss(k,phone)});["DIGIY_BUILD_PHONE","digiy_build_phone","DIGIY_PHONE"].forEach(k=>{ls(k,phone);ss(k,phone)});if(sl){SLKEYS.forEach(k=>{ls(k,sl);ss(k,sl)});["DIGIY_BUILD_SLUG","DIGIY_CURRENT_SLUG","DIGIY_SLUG","digiy_build_slug","digiy_slug"].forEach(k=>{ls(k,sl);ss(k,sl)});try{const m=JSON.parse(ls("digiy_module_slugs")||"{}")||{};m[MODULE]=sl;ls("digiy_module_slugs",JSON.stringify(m))}catch(_){}}}
function redirect(){try{location.replace("./hub.html")}catch(_){location.replace("./hub.html")}}
const phoneEl=$("phoneInput"),btnContinue=$("btnContinue");function updateContinueBtn(){btnContinue.disabled=norm(phoneEl.value).length<9}phoneEl.addEventListener("input",()=>{clearSt("status1");phoneEl.classList.remove("err-field");updateContinueBtn()});phoneEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!btnContinue.disabled)goStep2()});updateContinueBtn();
function goStep2(){const raw=norm(phoneEl.value);if(raw.length<9){phoneEl.classList.add("err-field");showSt("status1","❌ Numéro trop court.\nFormat attendu : 221 77 XXX XX XX","err");shake(phoneEl);return}btnContinue.disabled=true;clearSt("status1");confirmedPhone=raw;$("step1").classList.remove("active");$("step2").classList.add("active");$("dot1").className="step-dot done";$("dot1").textContent="✓";$("lbl1").className="step-lbl";$("dot2").className="step-dot active";$("lbl2").className="step-lbl active";$("conn").classList.add("done");$("phoneDisplay").textContent=fmt(confirmedPhone);pin="";updateDots();updateEnterBtn()}btnContinue.addEventListener("click",goStep2);
function goStep1(){$("step2").classList.remove("active");$("step1").classList.add("active");$("dot1").className="step-dot active";$("dot1").textContent="1";$("lbl1").className="step-lbl active";$("dot2").className="step-dot";$("lbl2").className="step-lbl";$("conn").classList.remove("done");pin="";isLogging=false;clearSt("status2");btnContinue.disabled=false;updateDots();updateEnterBtn()}$("btnBack").addEventListener("click",goStep1);
function updateDots(){for(let i=0;i<4;i++){const d=$("d"+i);d.classList.toggle("filled",i<pin.length);d.classList.remove("err")}}function updateEnterBtn(){$("btnEnter").disabled=isLogging||pin.length!==4}
$("keypad").addEventListener("click",e=>{const key=e.target.closest("[data-v]");if(!key||isLogging)return;const v=key.dataset.v;if(v==="DEL")pin=pin.slice(0,-1);else if(pin.length<4){pin+=v;if(pin.length===4)setTimeout(doLogin,120)}updateDots();updateEnterBtn();clearSt("status2")});document.addEventListener("keydown",e=>{if(document.activeElement===phoneEl||isLogging)return;if(!$("step2").classList.contains("active"))return;if(/^[0-9]$/.test(e.key)&&pin.length<4){pin+=e.key;updateDots();updateEnterBtn();if(pin.length===4)setTimeout(doLogin,120)}else if(e.key==="Backspace"){pin=pin.slice(0,-1);updateDots();updateEnterBtn()}});$("btnEnter").addEventListener("click",doLogin);
function parseVerifyPayload(data,fallbackPhone){let row=Array.isArray(data)?data[0]:data;const positive=value=>{if(value===true||value===1)return true;return["true","t","1","ok","active","allowed","valid","verified","granted"].includes(String(value||"").trim().toLowerCase())};if(positive(row))return{ok:true,phone:norm(fallbackPhone),slug:"",session_token:""};if(typeof row==="string"){const txt=row.trim(),low=txt.toLowerCase();if(["true","t","1","ok","active"].includes(low))return{ok:true,phone:norm(fallbackPhone),slug:"",session_token:""};if(txt.startsWith("(")&&txt.endsWith(")")){const parts=txt.slice(1,-1).split(",");if(["t","true","1","ok"].includes(String(parts[0]||"").trim().toLowerCase()))return{ok:true,phone:norm(parts[2]||fallbackPhone),slug:String(parts[1]||"").trim(),session_token:String(parts[3]||"").trim()}}try{row=JSON.parse(txt)}catch(_){return null}}if(!row||typeof row!=="object")return null;if(row.data&&typeof row.data==="object")row=row.data;if(row.result&&typeof row.result==="object")row=row.result;const status=String(row.status||"").trim().toLowerCase(),decisionKeys=["ok","success","valid","is_valid","verified","authenticated","allowed","access","access_ok","has_access","can_access","digiy_verify_pin"],hasDecision=decisionKeys.some(key=>Object.prototype.hasOwnProperty.call(row,key)),ok=hasDecision?decisionKeys.some(key=>positive(row[key])):positive(row.data)||positive(row.result)||positive(row.active)||positive(row.is_active)||["ok","active","allowed","valid"].includes(status);if(!ok)return null;return{ok:true,phone:norm(row.phone||row.p_phone||row.owner_phone||fallbackPhone),slug:String(row.slug||row.identifiant||row.build_slug||row.owner_slug||"").trim(),session_token:String(row.session_token||row.token||"").trim()}}
async function verifyByPhone(sb,phone,code){let lastError=null,hadResponse=false;const phones=phoneVariants(phone);for(const p of phones){for(const m of MODULE_ALIASES){const{data,error}=await sb.rpc("digiy_verify_pin",{p_phone:p,p_module:m,p_pin:code});if(error){lastError=error;continue}hadResponse=true;const parsed=parseVerifyPayload(data,p);if(parsed?.ok)return{ok:true,row:parsed,phone:parsed.phone||p,module:m,slug:parsed.slug||"",rail:"phone"}}}return{ok:false,lastError,hadResponse}}
async function verifyByHistoricSlug(sb,phone,code){let lastError=null,hadResponse=false;const slugs=slugCandidates(phone);for(const s of slugs){for(const m of MODULE_ALIASES){const{data,error}=await sb.rpc("digiy_verify_access",{p_slug:s,p_pin:code,p_module:m});if(error){lastError=error;continue}hadResponse=true;const parsed=parseVerifyPayload(data,phone);if(parsed?.ok)return{ok:true,row:parsed,phone:parsed.phone||norm(phone),module:m,slug:parsed.slug||s,rail:"historic_slug"}}}return{ok:false,lastError,hadResponse}}
async function verifyPinCompatible(sb,phone,code){const byPhone=await verifyByPhone(sb,phone,code);if(byPhone.ok)return byPhone;const bySlug=await verifyByHistoricSlug(sb,phone,code);if(bySlug.ok)return bySlug;if(!byPhone.hadResponse&&!bySlug.hadResponse){const err=bySlug.lastError||byPhone.lastError;if(err)throw new Error(err.message||"Erreur serveur")}return{ok:false}}
async function doLogin(){if(isLogging||pin.length!==4)return;isLogging=true;updateEnterBtn();showSt("status2","⏳ Vérification sécurisée BUILD…","spin");try{const sb=getSb(),verified=await verifyPinCompatible(sb,confirmedPhone,pin);if(!verified.ok){pin="";isLogging=false;updateDots();updateEnterBtn();for(let i=0;i<4;i++)$("d"+i).classList.add("err");shake($("pinDots"));showSt("status2","❌ Accès BUILD non reconnu.\nLe numéro, le PIN ou l’ancien identifiant BUILD ne correspond pas.","err");return}const row=verified.row||{},finalPhone=norm(verified.phone||confirmedPhone)||norm(confirmedPhone),finalSlug=cleanSlug(verified.slug||row.slug||row.identifiant)||slug(finalPhone);writeSession(finalPhone,finalSlug,row.session_token||row.token||"",verified.module,verified.rail);showSt("status2","✅ Accès BUILD ouvert. Redirection…","ok");setTimeout(redirect,700)}catch(err){pin="";isLogging=false;updateDots();updateEnterBtn();showSt("status2","❌ Erreur : "+(err?.message||"inattendue."),"err")}}
})();
</script>
