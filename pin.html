<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Accès BUILD • DIGIY</title>
  <meta name="theme-color" content="#020617"/>
  <script>
    window.DIGIY_SUPABASE_URL="https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY="sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON=window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_MODULE="BUILD";
    window.DIGIY_MODULE_LABEL="Je bâtis";
    window.DIGIY_MODULE_ICON="🧰";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#1e293b;--bg2:#334155;--line:rgba(148,163,184,.20);--ink:#f9fafb;--muted:#94a3b8;--gold:#facc15;--green:#22c55e;--red:#ef4444}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100dvh;display:grid;place-items:center;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(ellipse 800px 500px at 15% -5%,rgba(250,204,21,.13),transparent 55%),radial-gradient(ellipse 700px 400px at 88% 5%,rgba(34,197,94,.10),transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg))}
    .card{width:min(420px,100%);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:28px;padding:28px 24px 24px;box-shadow:0 28px 70px rgba(0,0,0,.55)}
    .header{text-align:center;margin-bottom:22px}.ico{font-size:36px;line-height:1;display:block;margin-bottom:10px}.badge{display:inline-flex;padding:5px 12px;border-radius:999px;border:1px solid rgba(250,204,21,.30);background:rgba(250,204,21,.08);color:#fde68a;font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}.title{font-size:1.25rem;font-weight:1000}
    .steps{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 22px}.step{display:flex;flex-direction:column;align-items:center;gap:4px}.step-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:1000;color:var(--muted)}.step-dot.active{border-color:var(--gold);background:rgba(250,204,21,.12);color:var(--gold)}.step-dot.done{border-color:var(--green);background:rgba(34,197,94,.15);color:var(--green)}.step-lbl{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase}.step-lbl.active{color:var(--gold)}.step-connector{width:32px;height:2px;background:var(--line);margin-bottom:14px}.step-connector.done{background:var(--green)}
    .panel{display:none}.panel.active{display:block}.label{display:block;font-size:.78rem;font-weight:950;color:var(--muted);margin-bottom:6px;text-transform:uppercase}.phone-wrap{position:relative}.phone-flag{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px}.input{width:100%;padding:14px 15px 14px 42px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--ink);font-size:1.05rem;font-weight:900;outline:none}.input.err-field{border-color:rgba(239,68,68,.50)!important}.phone-recap{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:12px;border:1px solid rgba(34,197,94,.25);background:rgba(34,197,94,.06);margin-bottom:18px}.phone-recap-num{font-size:.9rem;font-weight:950;color:#86efac}.phone-recap-btn{font-size:.75rem;font-weight:950;color:var(--muted);cursor:pointer;background:none;border:none;text-decoration:underline}
    .pin-dots{display:flex;justify-content:center;gap:16px;margin:8px 0 20px}.dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(148,163,184,.30)}.dot.filled{background:var(--gold);border-color:var(--gold)}.dot.err{border-color:var(--red)!important;background:rgba(239,68,68,.2)!important}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.key{border:1px solid rgba(148,163,184,.18);border-radius:14px;background:rgba(255,255,255,.04);color:var(--ink);font-size:1.3rem;font-weight:1000;min-height:58px;cursor:pointer}.key.zero{grid-column:2}.key.del{font-size:1rem;color:var(--muted)}
    .btn{width:100%;min-height:52px;border-radius:16px;border:1px solid rgba(250,204,21,.35);background:linear-gradient(135deg,rgba(250,204,21,.22),rgba(34,197,94,.18));color:#fff;font-size:1rem;font-weight:1000;cursor:pointer;margin-top:16px}.btn:disabled{opacity:.40;cursor:not-allowed}.status{margin-top:12px;display:none;border-radius:12px;font-size:.84rem;font-weight:900;line-height:1.5;white-space:pre-wrap}.status.show{display:block;padding:10px 13px}.status.err{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.30);color:#fca5a5}.status.ok{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.30);color:#86efac}.status.spin{background:rgba(148,163,184,.07);border:1px solid var(--line);color:var(--muted)}.note{margin-top:18px;text-align:center;color:rgba(148,163,184,.60);font-size:.74rem;font-weight:800;line-height:1.55}
  </style>
</head>
<body>
<div class="card">
  <div class="header"><span class="ico" id="moduleIcon">🧰</span><div class="badge">🔑 Accès DIGIY</div><div class="title" id="moduleLabel">Je bâtis</div></div>
  <div class="steps"><div class="step"><div class="step-dot active" id="dot1">1</div><div class="step-lbl active" id="lbl1">Numéro</div></div><div class="step-connector" id="conn"></div><div class="step"><div class="step-dot" id="dot2">2</div><div class="step-lbl" id="lbl2">Code</div></div></div>
  <div class="panel active" id="step1">
    <label class="label" for="phoneInput">📱 Ton numéro de téléphone</label>
    <div class="phone-wrap"><span class="phone-flag">🇸🇳</span><input id="phoneInput" class="input" type="tel" inputmode="numeric" placeholder="221 77 XXX XX XX" autocomplete="tel" maxlength="15"/></div>
    <div class="status" id="status1"></div><button class="btn" id="btnContinue" type="button" disabled>Continuer →</button>
  </div>
  <div class="panel" id="step2">
    <div class="phone-recap"><span class="phone-recap-num" id="phoneDisplay"></span><button class="phone-recap-btn" id="btnBack" type="button">Modifier</button></div>
    <label class="label">🔢 Ton code secret (4 chiffres)</label>
    <div class="pin-dots" id="pinDots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
    <div class="keypad" id="keypad"><button class="key" data-v="1" type="button">1</button><button class="key" data-v="2" type="button">2</button><button class="key" data-v="3" type="button">3</button><button class="key" data-v="4" type="button">4</button><button class="key" data-v="5" type="button">5</button><button class="key" data-v="6" type="button">6</button><button class="key" data-v="7" type="button">7</button><button class="key" data-v="8" type="button">8</button><button class="key" data-v="9" type="button">9</button><button class="key zero" data-v="0" type="button">0</button><button class="key del" data-v="DEL" type="button">⌫</button></div>
    <button class="btn" id="btnEnter" type="button" disabled>Entrer →</button><div class="status" id="status2"></div>
  </div>
  <div class="note">Ton numéro et ton code ne sont jamais partagés.<br>DIGIY BUILD · artisans tout corps de métiers · 100% indépendance ∞</div>
</div>
<script>
(function(){
"use strict";
const MODULE="BUILD",MODULE_LABEL=window.DIGIY_MODULE_LABEL||"Je bâtis",MODULE_ICON=window.DIGIY_MODULE_ICON||"🧰",MAX_AGE=8*60*60*1000;
const MODULE_ALIASES=["BUILD","BUILD_PRO"];
const SESSION_KEYS=["digiy_build_session","digiy_build_guard_session","digiy_guard_build_session","DIGIY_BUILD_ACCESS","DIGIY_PRO_BUILD_ACCESS","DIGIY_ACCESS","DIGIY_MODULE_ACCESS"];
const PHONE_KEYS=["digiy_build_phone","digiy_build_last_phone","DIGIY_BUILD_PHONE"];
const SLUG_KEYS=["digiy_build_last_slug","digiy_build_slug","DIGIY_BUILD_SLUG","DIGIY_CURRENT_SLUG","DIGIY_SLUG"];
const SENSITIVE_KEYS=["phone","tel","p_phone","owner_phone","owner_id","pin","pin4","code","token","session","session_token","access","auth","ok","unlocked","module","slug","return","redirect","redirect_url","url","from","v"];
const $=id=>document.getElementById(id);$("moduleLabel").textContent=MODULE_LABEL;$("moduleIcon").textContent=MODULE_ICON;document.title=`Accès ${MODULE_LABEL} • DIGIY`;
let pin="",confirmedPhone="";
const norm=value=>{const d=String(value||"").replace(/\D/g,"");return d.length===9?"221"+d:d};
const fmt=d=>d.length===12&&d.startsWith("221")?`${d.slice(0,3)} ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8,10)} ${d.slice(10)}`:d;
const slug=value=>String(value||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"-").replace(/[^a-z0-9._-]/g,"").replace(/-+/g,"-").replace(/^[-_.]+|[-_.]+$/g,"");
const fallback=p=>p?`build-${p}`:"";
const setL=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};const setS=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(_){}};const del=(s,k)=>{try{s.removeItem(k)}catch(_){}};
function cleanUrl(){try{const u=new URL(location.href);let changed=false;SENSITIVE_KEYS.forEach(k=>{if(u.searchParams.has(k)){u.searchParams.delete(k);changed=true}});if(changed)history.replaceState({},document.title,u.pathname+u.search+u.hash)}catch(_){}}
function clearOld(){const keys=[...SESSION_KEYS,...PHONE_KEYS,...SLUG_KEYS,"DIGIY_LOC_HUB_PHONE","digiy_phone","digiy_last_phone","digiy_last_slug"];for(const s of [sessionStorage,localStorage])keys.forEach(k=>del(s,k))}
function show(id,msg,kind){const e=$(id);e.className="status show "+kind;e.textContent=msg}function clear(id){const e=$(id);e.className="status";e.textContent=""}function shake(e){e.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:300})}
function sb(){if(window._digiyBuildSb)return window._digiyBuildSb;const url=window.DIGIY_SUPABASE_URL||"",key=window.DIGIY_SUPABASE_ANON_KEY||window.DIGIY_SUPABASE_ANON||"";if(!url||!key||!window.supabase?.createClient)throw new Error("Supabase indisponible");return window._digiyBuildSb=window.supabase.createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"digiy-build-pin"}})}
function truth(data){const raw=Array.isArray(data)?data[0]:data;if(raw===true||raw===1)return true;if(typeof raw==="string")return ["true","t","1","yes","ok"].includes(raw.trim().toLowerCase());if(raw&&typeof raw==="object")return ["ok","access","access_ok","has_access","allowed","active","is_active","subscribed","valid","success"].some(k=>raw[k]===true);return false}
function variants(value){const d=String(value||"").replace(/\D/g,""),out=[];const add=v=>{v=String(v||"").replace(/\D/g,"");if(v&&!out.includes(v))out.push(v)};add(d);if(d.length===9)add("221"+d);if(d.length===12&&d.startsWith("221"))add(d.slice(3));return out}
async function verify(client,phone,code){for(const p of variants(phone)){for(const m of MODULE_ALIASES){const {data,error}=await client.rpc("digiy_verify_pin",{p_phone:p,p_module:m,p_pin:code});if(!error&&truth(data)){const row=Array.isArray(data)?data[0]:data;return {ok:true,row:row&&typeof row==="object"?row:{},phone:norm(p)}}}}return {ok:false,row:{},phone:norm(phone)}}
async function rpcAccess(client,name,phone,module){const {data,error}=await client.rpc(name,{p_phone:phone,p_module:module});return !error&&truth(data)}
async function active(client,phone){const p=norm(phone);for(const m of MODULE_ALIASES)if(await rpcAccess(client,"digiy_has_module_access_from_abos",p,m))return true;for(const m of MODULE_ALIASES)if(await rpcAccess(client,"digiy_has_access",p,m))return true;return false}
function writeSession(phone,identity,token){clearOld();const now=Date.now(),session={module:MODULE,slug:slug(identity),phone:norm(phone),access:true,access_ok:true,pin_session_ok:true,verified:true,validated_at:now,verified_at:now,expires_at:now+MAX_AGE,session_token:String(token||""),source:"build_pin_verified"},raw=JSON.stringify(session);SESSION_KEYS.forEach(k=>{setL(k,raw);setS(k,raw)});setS("digiy_build_phone",session.phone);setS("DIGIY_BUILD_PHONE",session.phone);setL("digiy_build_slug",session.slug);setS("digiy_build_slug",session.slug);setL("digiy_build_last_slug",session.slug);setL("DIGIY_BUILD_SLUG",session.slug)}
cleanUrl();const phoneEl=$("phoneInput"),next=$("btnContinue");const updateNext=()=>next.disabled=norm(phoneEl.value).length<9;phoneEl.addEventListener("input",()=>{clear("status1");phoneEl.classList.remove("err-field");updateNext()});updateNext();
function step2(){const p=norm(phoneEl.value);if(p.length<9){phoneEl.classList.add("err-field");show("status1","❌ Numéro trop court.","err");shake(phoneEl);return}confirmedPhone=p;$("step1").classList.remove("active");$("step2").classList.add("active");$("dot1").className="step-dot done";$("dot1").textContent="✓";$("lbl1").className="step-lbl";$("dot2").className="step-dot active";$("lbl2").className="step-lbl active";$("conn").classList.add("done");$("phoneDisplay").textContent=fmt(p);pin="";dots()}next.addEventListener("click",step2);
$("btnBack").addEventListener("click",()=>{$("step2").classList.remove("active");$("step1").classList.add("active");$("dot1").className="step-dot active";$("dot1").textContent="1";$("dot2").className="step-dot";$("conn").classList.remove("done");pin="";dots();next.disabled=false});
function dots(){for(let i=0;i<4;i++){const d=$("d"+i);d.classList.toggle("filled",i<pin.length);d.classList.remove("err")}$("btnEnter").disabled=pin.length!==4}
$("keypad").addEventListener("click",e=>{const key=e.target.closest("[data-v]");if(!key)return;const v=key.dataset.v;if(v==="DEL")pin=pin.slice(0,-1);else if(pin.length<4)pin+=v;dots();clear("status2");if(pin.length===4)setTimeout(login,120)});$("btnEnter").addEventListener("click",login);
async function login(){if(pin.length!==4)return;$("btnEnter").disabled=true;show("status2","⏳ Vérification du code et de l’accès BUILD…","spin");try{const client=sb(),verified=await verify(client,confirmedPhone,pin);if(!verified.ok){pin="";dots();show("status2","❌ Code non reconnu pour ce numéro.","err");$("btnEnter").disabled=false;return}if(!(await active(client,verified.phone))){pin="";dots();show("status2","❌ Accès BUILD inactif. Vérifie ton abonnement.","err");$("btnEnter").disabled=false;return}const row=verified.row||{},identity=slug(row.slug||row.identifiant||fallback(verified.phone));if(!identity)throw new Error("Identité BUILD introuvable");writeSession(verified.phone,identity,row.session_token||"");show("status2","✅ Accès BUILD ouvert. Redirection…","ok");setTimeout(()=>location.replace("./hub.html"),500)}catch(error){pin="";dots();$("btnEnter").disabled=false;show("status2","❌ Vérification impossible. Réessaie.","err");console.error("[DIGIY BUILD]",error)}}
})();
</script>
</body>
</html>
