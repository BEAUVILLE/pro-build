  <rect width="1080" height="1350" rx="68" fill="url(#bg)"/>
  <rect width="1080" height="1350" rx="68" fill="url(#glow)"/>
  <circle cx="1035" cy="165" r="270" fill="#c4973f" opacity="0.16"/>
  <circle cx="1020" cy="1280" r="330" fill="#22c55e" opacity="0.12"/>
  <path d="M70 178 H1010" stroke="url(#gold)" stroke-width="3" opacity="0.72"/>

  <g transform="translate(78 72)">
