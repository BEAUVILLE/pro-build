    <text x="462" y="64" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing="3" fill="#2d2308">TOUCHER LA CARTE POUR OUVRIR</text>
    <text x="462" y="112" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="900" fill="#10251c">MA FICHE ARTISAN →</text>
