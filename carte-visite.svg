    <text x="0" y="104" font-family="Arial,Helvetica,sans-serif" font-size="102" font-weight="900" letter-spacing="-5" fill="#ffffff">MULTI</text>
    <text x="0" y="204" font-family="Arial,Helvetica,sans-serif" font-size="102" font-weight="900" letter-spacing="-5" fill="#fff0a8">SERVICES</text>
    <text x="0" y="270" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#dfffe9">Travaux · dépannage · entretien</text>
    <text x="0" y="316" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#dfffe9">Chantier · services pratiques</text>
  </g>

