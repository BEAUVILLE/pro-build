    <text x="55" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="900" fill="#0e4226">∞</text>
    <text x="140" y="34" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" letter-spacing="6" fill="#fff0a8">DIGIYLYFE</text>
    <text x="140" y="68" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#dfffe9">BUILD · CARTE ARTISAN</text>
