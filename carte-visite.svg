  <text x="540" y="1310" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#dfffe9">LE TERRAIN GARDE LA MAIN · DIGIY PRÉPARE</text>
