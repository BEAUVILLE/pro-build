<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Carte numérique DIGIY BUILD</title>
  <desc id="desc">Entrepreneur multi services, contact direct et zéro commission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a1d"/>
      <stop offset="0.55" stop-color="#0e4226"/>
      <stop offset="1" stop-color="#1e7a46"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.5" stop-color="#d7ad52"/>
      <stop offset="1" stop-color="#c4973f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.04" r="0.9">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#00160d" flood-opacity="0.38"/>
    </filter>
